<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jarvis — AI-Native Voice Assistant powered by Gemini">
    <title>JARVIS — AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- ===== Background Gradient Orbs ===== -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- ===== Main Container ===== -->
    <div class="app-container">

        <!-- ===== Header ===== -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="url(#grad)" stroke-width="2.5" opacity="0.8"/>
                        <circle cx="20" cy="20" r="8" fill="url(#grad)" opacity="0.6"/>
                        <circle cx="20" cy="20" r="3" fill="#fff"/>
                        <defs>
                            <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#FF6B35"/>
                                <stop offset="100%" stop-color="#FFB347"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="header-title">
                    <h1>JARVIS</h1>
                    <span class="header-subtitle" id="statusText">AI Assistant — Ready</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="settingsBtn" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <button class="icon-btn" id="clearChatBtn" title="Clear Chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- ===== Main Content ===== -->
        <main class="app-main">

            <!-- ===== AI Orb (Center Visualization) ===== -->
            <div class="orb-section" id="orbSection">
                <div class="ai-orb" id="aiOrb">
                    <div class="orb-ring ring-1"></div>
                    <div class="orb-ring ring-2"></div>
                    <div class="orb-ring ring-3"></div>
                    <div class="orb-core"></div>
                    <div class="pulse-ring"></div>
                </div>
                <p class="orb-label" id="orbLabel">Tap the mic or type a message</p>
            </div>

            <!-- ===== Chat Messages ===== -->
            <div class="chat-container" id="chatContainer">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be added here dynamically -->
                </div>
            </div>

        </main>

        <!-- ===== Input Bar ===== -->
        <footer class="input-bar">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="chatInput"
                    class="chat-input"
                    placeholder="Type a message or press the mic..."
                    autocomplete="off"
                />
                <button class="mic-btn" id="micBtn" title="Voice Input">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <button class="send-btn hidden" id="sendBtn" title="Send Message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </footer>

    </div>

    <!-- ===== Settings Panel (Slide-out) ===== -->
    <div class="settings-overlay hidden" id="settingsOverlay"></div>
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="icon-btn" id="closeSettingsBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="settings-tabs">
            <button class="tab-btn active" data-tab="profile">Profile</button>
            <button class="tab-btn" data-tab="apps">Apps</button>
            <button class="tab-btn" data-tab="websites">Websites</button>
            <button class="tab-btn" data-tab="contacts">Contacts</button>
        </div>

        <!-- Profile Tab -->
        <div class="tab-content active" id="tab-profile">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="profileName" class="glass-input" placeholder="Your name">
            </div>
            <div class="form-group">
                <label>Designation</label>
                <input type="text" id="profileDesignation" class="glass-input" placeholder="Your designation">
            </div>
            <div class="form-group">
                <label>Mobile</label>
                <input type="text" id="profileMobile" class="glass-input" placeholder="Your mobile number">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="profileEmail" class="glass-input" placeholder="Your email">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" id="profileCity" class="glass-input" placeholder="Your city">
            </div>
            <button class="primary-btn" id="saveProfileBtn">Save Profile</button>
        </div>

        <!-- Apps Tab -->
        <div class="tab-content" id="tab-apps">
            <div class="add-form">
                <input type="text" id="appName" class="glass-input" placeholder="App name">
                <input type="text" id="appPath" class="glass-input" placeholder="App path (e.g., C:\...\app.exe)">
                <button class="primary-btn small" id="addAppBtn">Add</button>
            </div>
            <div class="items-list" id="appsList"></div>
        </div>

        <!-- Websites Tab -->
        <div class="tab-content" id="tab-websites">
            <div class="add-form">
                <input type="text" id="webName" class="glass-input" placeholder="Website name">
                <input type="text" id="webUrl" class="glass-input" placeholder="URL (e.g., https://...)">
                <button class="primary-btn small" id="addWebBtn">Add</button>
            </div>
            <div class="items-list" id="websList"></div>
        </div>

        <!-- Contacts Tab -->
        <div class="tab-content" id="tab-contacts">
            <div class="add-form">
                <input type="text" id="contactName" class="glass-input" placeholder="Name">
                <input type="text" id="contactMobile" class="glass-input" placeholder="Mobile number">
                <input type="text" id="contactEmail" class="glass-input" placeholder="Email (optional)">
                <input type="text" id="contactCity" class="glass-input" placeholder="City (optional)">
                <button class="primary-btn small" id="addContactBtn">Add Contact</button>
            </div>
            <div class="items-list" id="contactsList"></div>
        </div>
    </div>

    <!-- ===== Toast Notification ===== -->
    <div class="toast hidden" id="toast">
        <span id="toastMessage"></span>
    </div>

    <!-- Audio player for TTS playback -->
    <audio id="ttsAudio" preload="none"></audio>

    <script src="/js/websocket.js"></script>
    <script src="/js/voice.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
